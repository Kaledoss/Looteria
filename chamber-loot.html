<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Story of Looteria – 3D-Kistenkammer Prototyp</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090d16;color:#f4e8d3;font-family:system-ui,Segoe UI,sans-serif;overflow:hidden}
#scene{position:fixed;inset:0}#scene canvas{display:block}
header{position:absolute;top:18px;left:20px;right:20px;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{margin:0;font-size:clamp(18px,2.3vw,29px);text-shadow:0 3px 12px #000}small{color:#c5ad83}
.panel{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:min(620px,calc(100vw - 30px));background:linear-gradient(140deg,#202335f0,#101826f5);border:2px solid #947345;border-radius:18px;padding:17px 20px;text-align:center;box-shadow:0 12px 50px #000b}
button{border:1px solid #efb85d;background:linear-gradient(#a93527,#6b191b);color:#fff3da;border-radius:10px;padding:12px 22px;font-weight:750;cursor:pointer;margin:5px;font-size:15px}
button.secondary{background:#243448;border-color:#59728e}button:disabled{opacity:.5;cursor:not-allowed}select{background:#17253a;color:#ffe3a2;border:1px solid #9e7542;border-radius:7px;padding:6px 10px;margin-bottom:9px}
#status{min-height:23px;color:#f8d48e;margin-bottom:8px}#reward{font-size:22px;font-weight:800;color:#ffdb7a;min-height:28px}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:#080d16;color:#f4c879;font-size:20px}
.badge{padding:7px 12px;border:1px solid #846b4b;border-radius:10px;background:#131a27c9}
@media(max-width:600px){header{top:10px;left:10px;right:10px}.badge{display:none}.panel{bottom:10px;padding:12px}button{padding:10px 14px}}
#flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 46%,#fff4c7 0%,#ffd47b 19%,transparent 72%);opacity:0;mix-blend-mode:screen;z-index:3}
#rarity{max-width:100%}
body.embedded header,body.embedded .panel{display:none!important}body.embedded{overflow:hidden}</style></head>
<body><div id="scene"></div><div id="flash"></div><div id="loading">3D-Kistenkammer wird geladen …</div>
<header><div><h1>👑 Story of Looteria · Kistenkammer</h1><small>Prototyp 03 · Lootchest · noch nicht ins Spiel integriert</small></div><div class="badge">Echte 3D-Geometrie · animierter Deckel</div></header>
<section class="panel"><label for="rarity">Test-Seltenheit: </label><select id="rarity"><option value="common">Gewöhnlich</option><option value="rare">Selten</option><option value="epic">Episch</option><option value="legendary">Legendär</option><option value="mythic">Mythisch</option><option value="jackpot">Jackpot</option><option value="mega">MEGAJACKPOT</option><option value="classic">Classic-Kiste (7 %)</option></select><div id="status">Bereit, die Lootchest zu öffnen. (Vorschau ohne Ruhmpunkte)</div><div id="reward"></div>
<button id="open" disabled>💎 Lootchest öffnen</button><button id="skip" class="secondary" disabled>⏭ Überspringen</button><button id="reset" class="secondary">↻ Zurücksetzen</button>
</section>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b0e18);scene.fog=new THREE.FogExp2(0x0b0e18,.042);
const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,100);camera.position.set(5.6,4.4,8.5);camera.lookAt(0,1.55,0);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;document.querySelector('#scene').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x7696c7,0x2e1c10,1.1));
function light(c,i,x,y,z,r){let p=new THREE.PointLight(c,i,r,2);p.position.set(x,y,z);scene.add(p);return p}
const fireL=light(0xff8d39,42,-4,2.8,-2,9),fireR=light(0xff8d39,42,4,2.8,-2,9);
const glow=light(0xffd477,0,0,2.0,0,6);
const stone=new THREE.MeshStandardMaterial({color:0x343b4b,roughness:.93});
const darkstone=new THREE.MeshStandardMaterial({color:0x222b3b,roughness:.9});
const gold=new THREE.MeshStandardMaterial({color:0xb88c42,metalness:.75,roughness:.28});
const iron=new THREE.MeshStandardMaterial({color:0x24232a,metalness:.55,roughness:.42});
function box(parent,w,h,d,x,y,z,mat,cast=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;parent.add(m);return m}
box(scene,22,.35,20,0,-.22,0,stone,false);
box(scene,22,9,.6,0,4,-7,darkstone,false);
for(let x=-10;x<=10;x+=2){for(let z=-6;z<=8;z+=2){box(scene,1.94,.05,1.94,x,-.02,z,((x+z)%4===0)?darkstone:stone,false)}}
for(let x=-10;x<=10;x+=2.5){box(scene,.16,8,.75,x,3.7,-6.6,stone,false)}
for(let x of [-4,4]){box(scene,.8,4.8,.8,x,2.2,-3.5,stone);box(scene,1.25,.35,1.25,x,4.5,-3.5,gold);box(scene,.8,.55,.8,x,3.1,-3.5,new THREE.MeshStandardMaterial({color:0xff7c22,emissive:0xff4a00,emissiveIntensity:2}));}
box(scene,3.8,.45,3.4,0,.27,0,stone);box(scene,3.4,.35,3,0,.65,0,darkstone);box(scene,2.85,.23,2.45,0,.95,0,gold);
function pixelTexture(){
const c=document.createElement('canvas');c.width=64;c.height=64;let g=c.getContext('2d');g.fillStyle='#986028';g.fillRect(0,0,64,64);
let rng=12345;function rand(){rng=(rng*1664525+1013904223)>>>0;return rng/4294967296}
for(let y=0;y<64;y+=8)for(let x=0;x<64;x+=8){let v=Math.floor(rand()*5);g.fillStyle=['#875021','#ad7130','#a86b2d','#bd7d34','#945825'][v];g.fillRect(x,y,8,8)}
for(let y=0;y<64;y+=16){g.fillStyle='#58351b';g.fillRect(0,y,64,2);g.fillStyle='#d09045';g.fillRect(0,y+2,64,1)}
const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;t.colorSpace=THREE.SRGBColorSpace;return t}
const wood=new THREE.MeshStandardMaterial({color:0x251326,roughness:.42,metalness:.3});
const runeMat=new THREE.MeshStandardMaterial({color:0xe63b52,emissive:0xb90034,emissiveIntensity:2.3,metalness:.3,roughness:.3});
const trim=new THREE.MeshStandardMaterial({color:0xe6a54d,metalness:.88,roughness:.19});
const black=new THREE.MeshStandardMaterial({color:0x130e1d,metalness:.7,roughness:.32});
const chest=new THREE.Group();chest.position.set(0,1.13,0);scene.add(chest);
box(chest,2.55,1.32,1.55,0,.67,0,wood);
for(let x of [-1.28,1.28])box(chest,.13,1.38,1.64,x,.67,0,trim);
for(let z of [-.8,.8]){box(chest,2.68,.12,.13,0,.17,z,iron);box(chest,2.68,.12,.13,0,1.2,z,trim)}
const hinge=new THREE.Group();hinge.position.set(0,1.31,-.78);chest.add(hinge);
box(hinge,2.61,.46,1.6,0,.23,.8,wood);
for(let x of [-1.31,1.31])box(hinge,.12,.5,1.66,x,.23,.8,iron);
for(let z of [.03,1.57])box(hinge,2.7,.12,.12,0,.28,z,trim);
box(hinge,.4,.6,.15,0,.1,1.62,trim);
box(hinge,.23,.27,.18,0,.12,1.74,gold);
// Magische Ranken, Goldbeschläge und leuchtende Runen auf dem Kistenkörper.
for(const x of [-.93,-.46,0,.46,.93]){
 box(chest,.12,.12,.055,x,.72,.811,runeMat);
 box(chest,.07,.43,.055,x,.72,.85,runeMat);
 box(hinge,.10,.12,.055,x,.25,1.635,runeMat);
}
for(const x of [-1.06,1.06])for(const y of [.32,1.04]){
 box(chest,.2,.2,.09,x,y,.84,trim);
}
const magicRing=new THREE.Group();scene.add(magicRing);magicRing.position.set(0,1.06,0);
for(let i=0;i<24;i++){const a=i*Math.PI/12;const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.065),runeMat);gem.position.set(Math.cos(a)*1.85,.13,Math.sin(a)*1.85);magicRing.add(gem)}
const aura=light(0xe2246c,8,0,2.2,0,6);
const burst=light(0xffd369,0,0,2.9,0,8);
// Sammelkarte: steigt sichtbar aus der geöffneten Kiste auf.
function makeCardTexture(){
 const c=document.createElement('canvas');c.width=512;c.height=768;const g=c.getContext('2d');
 let grad=g.createLinearGradient(0,0,512,768);grad.addColorStop(0,'#234a46');grad.addColorStop(1,'#0a171e');g.fillStyle=grad;g.fillRect(0,0,512,768);
 g.fillStyle='#b68d46';g.fillRect(18,18,476,732);g.fillStyle='#102a31';g.fillRect(34,34,444,700);
 g.fillStyle='#f5d6a4';g.font='bold 46px sans-serif';g.textAlign='center';g.fillText('LOOTERIA',256,98);
 g.fillStyle='#173e32';g.fillRect(66,135,380,455);g.fillStyle='#4d9b4a';g.fillRect(155,225,202,245);
 g.fillStyle='#254b29';g.fillRect(190,286,48,55);g.fillRect(278,286,48,55);g.fillRect(225,350,65,96);g.fillRect(195,386,34,60);g.fillRect(290,386,34,60);
 g.fillStyle='#c5ad6e';g.fillRect(66,618,380,3);g.font='30px sans-serif';g.fillText('✦ SAMMELKARTE ✦',256,686);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const card=new THREE.Group();const cardFront=new THREE.Mesh(new THREE.PlaneGeometry(1.12,1.68),new THREE.MeshBasicMaterial({map:makeCardTexture(),side:THREE.DoubleSide}));
card.add(cardFront);card.position.set(0,1.7,0);card.visible=false;scene.add(card);
const cardAura=new THREE.Mesh(new THREE.PlaneGeometry(1.26,1.82),new THREE.MeshBasicMaterial({color:0xffd37b,transparent:true,opacity:.24,side:THREE.DoubleSide,depthWrite:false}));cardAura.position.z=-.03;card.add(cardAura);
const particles=[];let particleMat=new THREE.MeshBasicMaterial({color:0xff3e8e,transparent:true,opacity:0,depthWrite:false});
for(let i=0;i<145;i++){const p=new THREE.Mesh(new THREE.BoxGeometry(.045,.045,.045),particleMat.clone());p.visible=false;scene.add(p);particles.push({p,seed:i*17.31,life:0})}
// Sternenexplosion: Partikel strahlen beim Aufspringen in alle Richtungen.
const sparks=[];
for(let i=0;i<210;i++){
 const m=new THREE.Mesh(new THREE.OctahedronGeometry(i%7===0?.065:.028),new THREE.MeshBasicMaterial({color:0xffd36b,transparent:true,opacity:0,depthWrite:false}));
 m.visible=false;scene.add(m);
 const theta=i*2.3999632297, vy=.22+((i*31)%89)/110;
 const r=Math.sqrt(Math.max(.05,1-vy*vy));
 sparks.push({m,vx:Math.cos(theta)*r,vy,vz:Math.sin(theta)*r,delay:(i%13)*.012});
}
const shockwaves=[];
for(let i=0;i<3;i++){
 const mesh=new THREE.Mesh(new THREE.TorusGeometry(1,.025,6,96),new THREE.MeshBasicMaterial({color:0xffd36b,transparent:true,opacity:0,depthWrite:false}));
 mesh.rotation.x=Math.PI/2;mesh.position.set(0,2.05+i*.14,0);mesh.visible=false;scene.add(mesh);shockwaves.push(mesh);
}
const flash=document.querySelector('#flash');
const rarity=document.querySelector('#rarity');
const rarities={common:['Gewöhnlich',0x69d8ff],rare:['Selten',0x369aff],epic:['Episch',0xb35dff],legendary:['Legendär',0xffb944],mythic:['Mythisch',0xff507c],jackpot:['JACKPOT',0xffd63b],mega:['MEGAJACKPOT',0xfff3ae],classic:['Classic-Kiste',0xffb65b]};
let mode='idle',start=0,skipped=false,prev=0;
function setRarity(){const [name,color]=rarities[rarity.value];glow.color.setHex(color);burst.color.setHex(color);cardAura.material.color.setHex(color);for(let q of particles)q.p.material.color.setHex(color);for(let q of sparks)q.m.material.color.setHex(color);for(let q of shockwaves)q.material.color.setHex(color);}
rarity.onchange=()=>{setRarity();if(mode==='done')finish()};
const status=document.querySelector('#status'),reward=document.querySelector('#reward'),openBtn=document.querySelector('#open'),skipBtn=document.querySelector('#skip');
function reset(){mode='idle';hinge.rotation.x=0;chest.rotation.z=0;chest.position.y=1.13;glow.intensity=0;burst.intensity=0;particles.forEach(q=>q.p.visible=false);sparks.forEach(q=>q.m.visible=false);shockwaves.forEach(q=>q.visible=false);flash.style.opacity='0';card.rotation.set(0,0,0);card.visible=false;card.position.set(0,1.7,0);card.scale.setScalar(.2);camera.position.set(5.6,4.4,8.5);camera.lookAt(0,1.55,0);status.textContent='Bereit, die Lootchest zu öffnen. (Vorschau ohne Ruhmpunkte)';reward.textContent='';openBtn.disabled=false;skipBtn.disabled=true;setRarity()}
function finish(){mode='done';hinge.rotation.x=-1.75;chest.rotation.z=0;chest.position.y=1.13;glow.intensity=12;burst.intensity=rarity.value==='mega'?65:rarity.value==='jackpot'?35:12;card.visible=true;card.position.y=3.25;card.scale.setScalar(1.25);card.rotation.set(0,0,0);flash.style.opacity='0';status.textContent='Die Lootchest wurde geöffnet!';reward.textContent=rarity.value==='classic'?'📦 Belohnung: 1 Classic-Kiste':'🎴 Beispielkarte · '+rarities[rarity.value][0];openBtn.disabled=true;skipBtn.disabled=true}
openBtn.onclick=()=>{mode='opening';start=performance.now();status.textContent='Die Kiste beginnt zu reagieren …';reward.textContent='';openBtn.disabled=true;skipBtn.disabled=false};
skipBtn.onclick=finish;document.querySelector('#reset').onclick=reset;
function animate(t){requestAnimationFrame(animate);let dt=Math.min((t-prev)/1000,.05);prev=t;
fireL.intensity=38+Math.sin(t*.008)*7;fireR.intensity=38+Math.cos(t*.007)*7;magicRing.rotation.y+=dt*.32;aura.intensity=8+Math.sin(t*.003)*3;
if(mode==='opening'){let s=(t-start)/1000;
chest.rotation.z=s>1&&s<2.7?Math.sin(s*47)*.025*Math.min(1,(s-1)*2):0;
chest.position.y=1.13+(s>1.3&&s<3.5?Math.sin(s*13)*.025:0);
glow.intensity=s<1.4?0:s<3.1?(s-1.4)*8:13;burst.intensity=s>3?Math.min(55,(s-3)*22)*(rarity.value==='mega'?1.5:rarity.value==='jackpot'?1:.35):0;
// Der Deckel wird erst unter Spannung gehalten, springt dann abrupt auf und federt nach.
const pop=(s-2.65)/.38;
if(pop<=0)hinge.rotation.x=Math.max(0,Math.sin(s*36)*.025);
else if(pop<1){const p=1-Math.pow(1-pop,3);hinge.rotation.x=-1.95*p;}
else {const u=s-3.03;hinge.rotation.x=-1.75-.22*Math.exp(-u*5)*Math.cos(u*24);}
const flashPower=rarity.value==='mega'?1:rarity.value==='jackpot'?.8:.55;
const pulse=Math.max(0,1-Math.abs(s-3.03)/.42);
flash.style.opacity=String(Math.min(.95,Math.pow(pulse,2)*flashPower));
if(s>3.03){
 const age=s-3.03;
 sparks.forEach(q=>{
 const a=age-q.delay;if(a<=0)return;
 const life=Math.min(1,a/2.25);q.m.visible=life<1;
 q.m.position.set(q.vx*a*3.8,2.05+q.vy*a*4.3-1.3*a*a,q.vz*a*3.8);
 q.m.material.opacity=(1-life)*(.9+(rarity.value==='mega'?.1:0));
 q.m.rotation.set(a*5,a*4,a*3);
 });
 shockwaves.forEach((q,i)=>{
 const a=age-i*.17;q.visible=a>0&&a<1.5;
 if(a>0){q.scale.setScalar(.3+a*3.8);q.material.opacity=Math.max(0,.8-a*.6);}
 });
}
let k=Math.min(1,s/5);camera.position.lerp(new THREE.Vector3(4.3,3.4,6.4),.02*k);
camera.lookAt(0,1.7,0);
if(s>3){status.textContent='Magisches Licht steigt aus der Truhe …';particles.forEach((q,i)=>{let a=s-3-q.seed*.015;if(a>0){q.p.visible=true;let v=(a%2.5)/2.5;q.p.position.set(Math.sin(q.seed*3)*(.3+v*1.5),1.8+v*3.1,Math.cos(q.seed*2)*(.3+v*1.2));q.p.material.opacity=(1-v)*.95;q.p.rotation.y+=dt*2}})}
// Die Karte schießt nach oben, dreht sich und rastet groß und leuchtend ein.
if(s>3.28){
 const k=Math.min(1,(s-3.28)/1.75);
 const ease=1-Math.pow(1-k,4);
 const overshoot=Math.sin(Math.PI*k)*.27;
 card.visible=true;
 card.position.y=1.55+1.85*ease+overshoot+Math.sin(t*.004)*.04;
 card.scale.setScalar(.12+1.13*ease+overshoot*.3);
 card.rotation.y=(1-ease)*Math.PI*2.2+Math.sin(t*.001)*.07;
 card.rotation.z=(1-ease)*.26*Math.sin(k*15);
 cardAura.material.opacity=.22+.4*Math.sin(Math.PI*k);
}

if(s>=6.6)finish();
}
renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
document.querySelector('#loading').remove();reset();requestAnimationFrame(animate);
if(new URLSearchParams(location.search).has('embed')){document.body.classList.add('embedded');const choice=new URLSearchParams(location.search).get('choice');const selector=document.querySelector('#rarity')||document.querySelector('#boosterType');if(selector&&choice){selector.value=choice;selector.dispatchEvent(new Event('change'))}setTimeout(()=>document.querySelector('#open')?.click(),650);window.addEventListener('message',e=>{if(e.data?.looteria==='skip')document.querySelector('#skip')?.click()})}
</script></body></html>
